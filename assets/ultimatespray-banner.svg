<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">UltimateSpray — global routing for authorized security assessments</title>
  <desc id="desc">A cybersecurity console connects to five illuminated nodes on a world map. Their routes converge on a target server inside a magenta reticle. The illustration is conceptual.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#05090f"/>
      <stop offset=".55" stop-color="#091624"/>
      <stop offset="1" stop-color="#080c17"/>
    </linearGradient>
    <linearGradient id="route" x2="1">
      <stop stop-color="#36f5d0"/>
      <stop offset=".65" stop-color="#56d8ff"/>
      <stop offset="1" stop-color="#fd5fa9"/>
    </linearGradient>
    <radialGradient id="mapGlow">
      <stop stop-color="#00dcb5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00dcb5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="targetGlow">
      <stop stop-color="#fa408e" stop-opacity=".15"/>
      <stop offset="1" stop-color="#fa408e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#65afbc" stroke-opacity=".055"/>
      <circle cx="0" cy="0" r="1" fill="#75d4db" fill-opacity=".15"/>
    </pattern>
    <pattern id="landDots" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#0c2c35"/>
      <circle cx="3.5" cy="3.5" r="1.15" fill="#358c96"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0h4" stroke="#8fffe0" stroke-opacity=".06"/>
    </pattern>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1400" height="500" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1400" height="500" fill="url(#background)"/>
    <rect width="1400" height="500" fill="url(#grid)"/>
    <ellipse cx="730" cy="298" rx="480" ry="230" fill="url(#mapGlow)"/>
    <circle cx="1210" cy="300" r="175" fill="url(#targetGlow)"/>
    <!-- Quiet circuit traces frame the composition. -->
    <g fill="none" stroke="#2b6c7c" stroke-width="1" opacity=".35">
      <path d="M0 134h27l19 19h48M1400 127h-29l-30 30h-57M0 397h32l30-30h25M1400 413h-35l-23-23h-43"/>
      <path d="M315 0v23l25 25h101M1062 0v20l-24 24h-102"/>
      <circle cx="94" cy="153" r="3"/><circle cx="1284" cy="157" r="3"/>
      <circle cx="87" cy="367" r="3"/><circle cx="1299" cy="390" r="3"/>
    </g>

    <text x="60" y="87" fill="#edf8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-2.7">Ultimate<tspan fill="#3af2ce">Spray</tspan></text>
    <g font-family="Consolas, Liberation Mono, monospace">
      <text x="63" y="123" fill="#96b8c7" font-size="16" letter-spacing="2">IDENTITY SECURITY / GLOBAL ROUTING</text>
      <rect x="1100" y="51" width="239" height="32" rx="4" fill="#0a2427" stroke="#2a7e73"/>
      <path d="M1116 63l5-3 5 3v6l-5 3-5-3Z" fill="none" stroke="#4bf2cd"/>
      <text x="1140" y="72" fill="#7ae7d3" font-size="12" letter-spacing="1.2">AUTHORIZED ASSESSMENT</text>
      <text x="1338" y="112" fill="#587684" font-size="11" text-anchor="end" letter-spacing="1.5">CONCEPTUAL NETWORK VIEW</text>
    </g>
    <path d="M60 151h1280" stroke="#255461"/>
    <path d="M60 151h150" stroke="#3af2ce" stroke-width="2"/>
    <path d="M1331 147l8 4-8 4" fill="none" stroke="#508391"/>

    <!-- World map: distributed egress nodes, not measured traffic. -->
    <g transform="translate(0 28)">
      <ellipse cx="750" cy="270" rx="350" ry="126" fill="#071a24" fill-opacity=".65" stroke="#337a86" stroke-opacity=".6"/>
      <g fill="none" stroke="#448492" stroke-opacity=".16">
        <path d="M400 270h700M750 144v252M430 218h640M430 322h640"/>
        <ellipse cx="750" cy="270" rx="230" ry="126"/>
        <ellipse cx="750" cy="270" rx="120" ry="126"/>
      </g>
      <g fill="url(#landDots)" stroke="#3c8b96" stroke-width="1" stroke-linejoin="round">
        <path d="M475 216 503 194 544 185 573 196 588 215 618 223 611 242 587 247 572 264 543 270 521 250 491 248 472 235Z"/>
        <path d="M554 279 584 270 614 283 628 306 612 344 599 372 583 358 574 327 558 309Z"/>
        <path d="M671 211 698 198 729 203 749 219 733 235 703 234 680 227Z"/>
        <path d="M706 242 749 233 778 247 791 270 779 304 754 336 728 325 711 289 698 261Z"/>
        <path d="M748 205 788 187 846 187 888 197 929 211 976 234 962 251 929 258 904 247 871 259 835 247 807 230 776 227Z"/>
        <path d="M870 309 902 293 937 304 956 327 934 344 898 340 875 326Z"/>
      </g>
      <!-- Operator connection fans out through the map. -->
      <g fill="none" stroke="#3af2ce" stroke-linecap="round">
        <path d="M302 270h43l24-12h48l23 7h34" stroke-width="2.5" filter="url(#neon)"/>
        <g stroke-width="1.5" stroke-opacity=".4" stroke-dasharray="4 6">
          <path d="M474 265Q515 225 551 226M474 265Q523 312 593 314M474 265Q600 170 722 215M474 265Q660 326 770 282M474 265Q735 176 914 224"/>
        </g>
      </g>
      <!-- Five global routes converge on one destination. -->
      <g fill="none" stroke="url(#route)" stroke-width="2" stroke-linecap="round" filter="url(#neon)">
        <path d="M551 226C730 130 1011 144 1162 261" opacity=".75"/>
        <path d="M593 314C766 392 1028 360 1162 276" opacity=".65"/>
        <path d="M722 215C899 145 1052 184 1162 265" opacity=".85"/>
        <path d="M770 282C925 305 1073 292 1162 270" opacity=".8"/>
        <path d="M914 224C1020 215 1100 232 1162 268"/>
      </g>
      <g fill="#071923" stroke="#3af2ce" stroke-width="1.5">
        <circle cx="551" cy="226" r="13"/><circle cx="593" cy="314" r="13"/>
        <circle cx="722" cy="215" r="13"/><circle cx="770" cy="282" r="13"/>
        <circle cx="914" cy="224" r="13"/>
      </g>
      <g fill="#77ffe0" filter="url(#neon)">
        <circle cx="551" cy="226" r="4"/><circle cx="593" cy="314" r="4"/>
        <circle cx="722" cy="215" r="4"/><circle cx="770" cy="282" r="4"/>
        <circle cx="914" cy="224" r="4"/>
      </g>
      <g fill="#77b7c2" font-family="Consolas, Liberation Mono, monospace" font-size="10" letter-spacing="1">
        <text x="537" y="204">01</text><text x="609" y="337">02</text>
        <text x="706" y="193">03</text><text x="783" y="311">04</text><text x="928" y="207">05</text>
      </g>
    </g>

    <!-- Operator terminal. -->
    <path d="M64 242v-14h18M291 228h18v14M64 365v14h18M291 379h18v-14" fill="none" stroke="#3af2ce" stroke-width="2"/>
    <rect x="72" y="237" width="230" height="129" rx="6" fill="#0b202a" stroke="#578c97" stroke-width="1.5"/>
    <rect x="82" y="247" width="210" height="106" rx="2" fill="#050e16"/>
    <rect x="82" y="247" width="210" height="106" fill="url(#scanlines)"/>
    <path d="M83 268h209" stroke="#234452"/>
    <g fill="#476b79"><circle cx="92" cy="257" r="2.5"/><circle cx="102" cy="257" r="2.5"/><circle cx="112" cy="257" r="2.5"/></g>
    <g font-family="Consolas, Liberation Mono, monospace" font-size="12">
      <text x="97" y="289" fill="#6b9aa8">security@operator</text>
      <text x="97" y="311" fill="#4bf2cd">&gt; ultimatespray</text>
      <path d="M98 328h8l-8 8" fill="none" stroke="#4bf2cd" stroke-width="1.5"/>
      <rect x="116" y="329" width="7" height="10" fill="#4bf2cd"/>
    </g>
    <path d="M187 367v17m-44 1h88" stroke="#578c97" stroke-width="5" stroke-linecap="round"/>

    <!-- Target host with a cyber HUD reticle. -->
    <g transform="translate(1208 298)">
      <circle r="76" fill="none" stroke="#b74580" stroke-opacity=".4" stroke-dasharray="2 8"/>
      <path d="M-43-59A73 73 0 0 1 59-43M43 59A73 73 0 0 1-59 43" fill="none" stroke="#fa5eab" stroke-width="2"/>
      <circle r="52" fill="#261426" fill-opacity=".65" stroke="#fa5eab" stroke-opacity=".7"/>
      <path d="M-88 0h22M66 0h22M0-88v22M0 66v22" stroke="#fd70b4" stroke-width="1.5"/>
      <path d="M-34-31v-9h9M25-40h9v9M-34 31v9h9M25 40h9v-9" fill="none" stroke="#fd70b4"/>
      <g fill="#231d32" stroke="#ff93c5" stroke-width="1.4">
        <rect x="-24" y="-26" width="48" height="15" rx="3"/>
        <rect x="-24" y="-7" width="48" height="15" rx="3"/>
        <rect x="-24" y="12" width="48" height="15" rx="3"/>
      </g>
      <g stroke="#a86591"><path d="M-15-18h18M-15 1h18M-15 20h18"/></g>
      <g fill="#ff93c5" filter="url(#neon)"><circle cx="14" cy="-18" r="2"/><circle cx="14" cy="1" r="2"/><circle cx="14" cy="20" r="2"/></g>
    </g>

    <g font-family="Consolas, Liberation Mono, monospace" text-anchor="middle">
      <g font-size="14" font-weight="700" letter-spacing="2">
        <text x="187" y="434" fill="#6de5ce">OPERATOR</text>
        <text x="750" y="434" fill="#6de5ce">GLOBAL EGRESS</text>
        <text x="1208" y="434" fill="#f395c1">TARGET HOST</text>
      </g>
      <g fill="#648896" font-size="11" letter-spacing=".8">
        <text x="187" y="456">SECURITY CONSOLE</text>
        <text x="750" y="456">AWS API GATEWAY / MULTI-REGION</text>
        <text x="1208" y="456">APPROVED SCOPE</text>
      </g>
    </g>
    <path d="M23 23h25M23 23v25M1352 23h25v25M23 452v25h25M1352 477h25v-25" fill="none" stroke="#447885" stroke-width="2"/>
  </g>
  <rect x=".5" y=".5" width="1399" height="499" rx="19.5" fill="none" stroke="#2c495c"/>
</svg>
