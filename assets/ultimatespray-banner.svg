<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">UltimateSpray</title>
  <desc id="desc">AWS API Gateway proxy orchestration for authorized security assessments.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="0.55" stop-color="#10283a"/>
      <stop offset="1" stop-color="#0a1728"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43e0d2"/>
      <stop offset="1" stop-color="#7ab7ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2accc8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2accc8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#76a3b9" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1400" height="360" rx="22" fill="url(#background)"/>
  <rect width="1400" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="1120" cy="185" r="260" fill="url(#glow)"/>
  <rect x="54" y="66" width="7" height="228" rx="3.5" fill="url(#accent)"/>

  <text x="100" y="151" fill="#f1f7fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">
    Ultimate<tspan fill="#51dace">Spray</tspan>
  </text>
  <text x="103" y="203" fill="#bad1df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="500">
