  </text>

  <g fill="none" stroke="#6ed4d5" stroke-width="2.5" stroke-linecap="round">
    <path d="M1075 180 953 103" stroke-opacity="0.58"/>
    <path d="M1075 180 1233 91" stroke-opacity="0.58"/>
    <path d="M1075 180 1263 223" stroke-opacity="0.58"/>
    <path d="M1075 180 994 283" stroke-opacity="0.58"/>
  </g>
  <g fill="#112d3f" stroke="#70d8d7" stroke-width="3">
    <circle cx="953" cy="103" r="25"/>
    <circle cx="1233" cy="91" r="25"/>
    <circle cx="1263" cy="223" r="25"/>
    <circle cx="994" cy="283" r="25"/>
  </g>
  <g fill="#7ce9df">
    <circle cx="953" cy="103" r="5"/>
    <circle cx="1233" cy="91" r="5"/>
    <circle cx="1263" cy="223" r="5"/>
    <circle cx="994" cy="283" r="5"/>
  </g>
  <circle cx="1075" cy="180" r="78" fill="#102f40" stroke="url(#accent)" stroke-width="4"/>
  <path d="M1036 167h78m-63-19h48m-48 38h48m-63 18h78" fill="none" stroke="#83ece2" stroke-width="5" stroke-linecap="round"/>
  <text x="1075" y="232" text-anchor="middle" fill="#bad1df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">
