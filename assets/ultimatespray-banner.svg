  <rect x="102" y="235" width="262" height="42" rx="21" fill="#153a45" stroke="#3fcac4" stroke-opacity="0.55"/>
  <text x="233" y="262" text-anchor="middle" fill="#80eee1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.1">
