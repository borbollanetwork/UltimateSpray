<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
  <title id="title">UltimateSpray: from authorized scope to evidence</title>
  <desc id="desc">A conceptual overview connecting test scope, AWS API Gateway infrastructure, identity signals, and verified findings.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081423"/>
      <stop offset="0.58" stop-color="#102a3b"/>
      <stop offset="1" stop-color="#0a1929"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50dfd0"/>
      <stop offset="1" stop-color="#8abaff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#37c9c8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#37c9c8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#a7d7df" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1400" height="410" rx="24" fill="url(#background)"/>
  <rect width="1400" height="410" rx="24" fill="url(#grid)"/>
  <circle cx="705" cy="310" r="400" fill="url(#halo)"/>
  <path d="M70 160h1260" stroke="url(#accent)" stroke-opacity="0.32"/>

  <text x="72" y="103" fill="#f1f8fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2.7">Ultimate<tspan fill="#57ded1">Spray</tspan></text>
  <text x="75" y="139" fill="#b8d0dd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500">A macro view of an authorized identity security assessment</text>

  <g fill="none" stroke="#6fcece" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M348 266h38"/><path d="m378 258 10 8-10 8"/>
    <path d="M678 266h38"/><path d="m708 258 10 8-10 8"/>
    <path d="M1008 266h38"/><path d="m1038 258 10 8-10 8"/>
