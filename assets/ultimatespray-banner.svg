  <g fill="#102b3b" stroke="#79c9d1" stroke-opacity="0.4" stroke-width="1.5">
    <rect x="70" y="188" width="278" height="173" rx="20"/>
    <rect x="400" y="188" width="278" height="173" rx="20"/>
    <rect x="730" y="188" width="278" height="173" rx="20"/>
    <rect x="1060" y="188" width="278" height="173" rx="20"/>
  </g>
  <g fill="#15394a">
    <circle cx="209" cy="241" r="36"/><circle cx="539" cy="241" r="36"/>
    <circle cx="869" cy="241" r="36"/><circle cx="1199" cy="241" r="36"/>
  </g>

  <g fill="none" stroke="#78e6dc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="195" y="224" width="28" height="34" rx="3"/>
    <path d="M201 233h16M201 241h10m-10 8 4 4 8-9"/>
    <path d="m539 225 13 8v16l-13 8-13-8v-16z"/>
    <circle cx="539" cy="241" r="3" fill="#78e6dc" stroke="none"/>
