    <text x="869" y="311">IDENTITY</text><text x="1199" y="311">EVIDENCE</text>
  </g>
  <g fill="#a9c7d2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle">
